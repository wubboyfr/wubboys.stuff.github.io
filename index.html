<!DOCTYPE html>

<html lang="en">

<head>

    <!-- Tells the browser what character encoding to use -->
    <meta charset="UTF-8">

    <!-- Makes the website work properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title shown in the browser tab -->
    <title>wubboys stuff :3</title>


    <!-- =========================
         CSS / STYLING
         ========================= -->

    <style>

        /* Apply this to EVERYTHING */
        * {
            box-sizing: border-box;
        }


        /* The entire page */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #111;
        }


        /* Every SiteBuilder element */
        .element {
            position: relative;
            min-height: 10px;
            margin: 6px 0;
            padding: 5px;
        }


        /* Two-column sections */
        .cols {
            display: grid;

            /* Two equal columns */
            grid-template-columns: 1fr 1fr;

            /* Space between the columns */
            gap: 20px;
        }


        /* Buttons */
        .sb-btn {
            display: inline-block;

            /* Remove the normal underline from links */
            text-decoration: none;

            /* Space inside the button */
            padding: 10px 18px;

            /* Purple background */
            background: #7c5cff;

            /* White text */
            color: white;

            /* Rounded corners */
            border-radius: 7px;
        }


        /* Images can't be wider than their container */
        img {
            max-width: 100%;
        }


        /* =========================
           PHONE / SMALL SCREEN
           ========================= */

        @media (max-width: 600px) {

            .cols {
                /* Turn the two columns into one column */
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TITLE
         ========================= -->

    <div
        class="element"
        data-type="heading"
        style="
            font-size: 33px;
            font-family: 'Comic Sans MS', cursive;
        "
    >

        <div style="text-align: center;">

            <b>
                hi! :3
            </b>

        </div>

    </div>


    <!-- =========================
         WELCOME TEXT
         ========================= -->

    <div
        class="element"
        data-type="text"
        style="
            font-family: 'Comic Sans MS', cursive;
        "
    >

        <p>
            welcome to my website
        </p>

    </div>


    <!-- =========================
         GAME INTRO TEXT
         ========================= -->

    <div
        class="element"
        data-type="text"
        style="
            font-family: 'Comic Sans MS', cursive;
        "
    >

        <p>
            play my games!!!
        </p>

    </div>


    <!-- =========================
         GAME SECTION
         ========================= -->

    <div
        class="element"
        data-type="cards"
        style="
            font-family: 'Comic Sans MS', cursive;
        "
    >

        <section>

            <!-- Section title -->
            <h2>
                the games
            </h2>


            <!-- Two-column layout -->
            <div class="cols">


                <!-- GAME 1 -->

                <p>

                    <a
                        href="https://scratch.mit.edu/projects/1382630822/fullscreen/"
                    >
                        chicolico battles 1: redmond on Scratch
                    </a>

                </p>


                <!-- GAME 2 -->

                <p>

                    <a
                        href="https://scratch.mit.edu/projects/1307821089/"
                    >
                        flappy chicolico on Scratch
                    </a>

                </p>


            </div>

        </section>

    </div>


</body>

</html>
